name: Frontend CI/CD

on:
  push:
    branches: [ "main", "gamificacioncicd" ]
  pull_request:
    branches: [ "main", "gamificacioncicd" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # For single-repo frontend, run in repository root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate environment
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_METRICS_ENDPOINT: ${{ secrets.VITE_METRICS_ENDPOINT }}
        run: npm run ci:env:validate

      - name: Lint
        run: npm run ci:lint

      - name: Build
        run: npm run ci:build

      - name: Unit tests
        run: npm run ci:test

      - name: Setup release environment
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_METRICS_ENDPOINT: ${{ secrets.VITE_METRICS_ENDPOINT }}
        run: npm run ci:env:setup

      - name: Smoke test on preview (dist)
        run: npm run ci:smoke

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    env:
      RENDER_DEPLOY_HOOK_URL_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_URL_FRONTEND }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID_FRONTEND: ${{ secrets.RENDER_SERVICE_ID_FRONTEND }}
      FRONTEND_PUBLIC_URL: ${{ secrets.FRONTEND_PUBLIC_URL }}
    steps:
      - name: Trigger Render Deploy via Hook
        if: ${{ env.RENDER_DEPLOY_HOOK_URL_FRONTEND != '' }}
        run: |
          echo "Triggering Render deploy via Deploy Hook"
          curl -fsSL -X POST "${{ env.RENDER_DEPLOY_HOOK_URL_FRONTEND }}"
      - name: Trigger Render Deploy via API
        if: ${{ env.RENDER_DEPLOY_HOOK_URL_FRONTEND == '' && env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID_FRONTEND != '' }}
        run: |
          echo "Triggering Render deploy via API"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${env.RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${env.RENDER_SERVICE_ID_FRONTEND}/deploys"
      - name: Skip deploy (secrets not configured)
        if: ${{ env.RENDER_DEPLOY_HOOK_URL_FRONTEND == '' && (env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID_FRONTEND == '') }}
        run: |
          echo "Deploy skipped: Render secrets not configured. Configure RENDER_DEPLOY_HOOK_URL_FRONTEND or API key + service ID."

      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Release health check (poll deployed URL)
        if: ${{ env.FRONTEND_PUBLIC_URL != '' }}
        env:
          RELEASE_MAX_RETRIES: 30
          RELEASE_RETRY_DELAY_MS: 10000
        run: npm run ci:release:health